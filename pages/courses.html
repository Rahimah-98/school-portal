<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teachers:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link
      rel="shortcut icon"
      href="../assets/img/logo.png"
      type="image/x-icon" />
    <title>Aurora Academy | Courses</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <nav class="navbar">
        <a class="logo" href="/">
          <img src="../assets/img/logo.png" alt="Logo" class="logo-img" />
          <span class="logo-text">Aurora Academy</span>
        </a>

        <!-- MENU -->
        <button class="menu-btn" id="menuBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
          <li><a href="/index.html">Home</a></li>
          <li><a href="./courses.html">Courses</a></li>
          <li><a href="./profile.html">Profile</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="main">
      <section class="courses-section">
        <div class="top-bar">
          <div>
            <h1>Our Courses</h1>
            <p>Explore our wide range of courses.</p>
          </div>

          <div class="controls">
            <input
              type="text"
              id="searchInput"
              placeholder="Search courses..." />

            <div class="filter-buttons">
              <button class="filter-btn active" data-grade="all">All</button>
              <button class="filter-btn" data-grade="10">Grade 10</button>
              <button class="filter-btn" data-grade="11">Grade 11</button>
            </div>
          </div>
        </div>

        <div class="courses-container" id="coursesContainer"></div>

        <div class="details-panel" id="detailsPanel">
          <h2>Course Details</h2>

          <img id="detailsImage" src="" alt="Course Image" />

          <div class="details-content">
            <h3 id="detailsTitle"></h3>
            <p>
              <strong>Instructor:</strong>
              <span id="detailsInstructor" class="instructor"></span>
            </p>
            <p><strong>Grade:</strong> <span id="detailsGrade"></span></p>
            <p id="detailsDescription"></p>
          </div>
        </div>

        <div class="form-section">
          <h2>Add New Course</h2>

          <form id="courseForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Course Name</label>
                <input
                  type="text"
                  id="courseName"
                  placeholder="Enter course name" />
              </div>

              <div class="form-group">
                <label>Instructor</label>
                <input
                  type="text"
                  id="instructor"
                  placeholder="Enter instructor name" />
              </div>

              <div class="form-group">
                <label>Grade Level</label>
                <select id="gradeLevel">
                  <option value="">Select grade</option>
                  <option value="10">Grade 10</option>
                  <option value="11">Grade 11</option>
                </select>
              </div>

              <div class="form-group">
                <label>Image URL</label>
                <input
                  type="text"
                  id="imageUrl"
                  placeholder="Enter image URL" />
              </div>
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea
                id="description"
                placeholder="Enter short description"></textarea>
            </div>

            <button type="submit" class="add-btn">+ Add Course</button>
          </form>
        </div>
      </section>
    </main>

    <!-- JAVASCRIPT REFERENCE -->
    <script src="../js/courses.js"></script>
  </body>
</html>
